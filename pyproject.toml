[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfllib-monza"
version = "0.1.0"
description = "Adaptive Federated Learning Simulator - Monza"
requires-python = ">=3.11"
dependencies = [
    # Core scientific computing
    "numpy<2",
    "pandas",
    "scikit-learn",
    "scipy",
    "ujson",
    "h5py",
    # Visualization
    "seaborn",
    "matplotlib",
    # Utilities
    "click",
    "calmsize",
    "memory-profiler",
    "portalocker",
    "tqdm",
    "cmake<4.0.0", 
    # PyTorch ecosystem (Mesma versão do Puma ou mais atual)
    "torch>=2.0.1",
    "torchaudio>=2.0.2",
    "torchtext",
    "torchvision>=0.15.2",
    # Advanced ML
    "cvxpy",
    "higher",
    "diffusers",
    "accelerate",
    "transformers",
]

[tool.ruff]
line-length = 99
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
# Mantido o index do cu118 conforme o Puma, mas o uv buscará a versão mais atual de PyTorch disponível para esta arquitetura
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["system", "dataset"]